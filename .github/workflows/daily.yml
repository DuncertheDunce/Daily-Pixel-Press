name: Daily edition

on:
  schedule:
    # 06:05 UTC = 12:05 AM Central Standard Time (1:05 AM during daylight saving)
    - cron: "5 6 * * *"
  workflow_dispatch:   # adds a "Run workflow" button so you can build on demand

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today's edition
        run: python build.py
      - name: Save the new page
        run: |
          git config user.name "daily-press-bot"
          git config user.email "daily-press-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Edition for $(date -u +%F)"
          git push
